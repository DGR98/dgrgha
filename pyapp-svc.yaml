# Write service manefest file for kubernetes
apiVersion: v1
kind: Service
metadata:
  name: pyapp-service
  labels:
    app: pyapp
spec:
  selector:
    app: pyapp
  ports:
    - name: application
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: monitoring
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: LoadBalancer
